version: 2

project:
  title: The Observatory
  prompt_format: h3_base
  language: English
  visual_style: >-
    Live-action cinematic science fiction with restrained natural
    performances, anamorphic lenses, shallow depth of field, subtle film
    grain, realistic skin texture, and cool moonlight contrasted with warm
    tungsten practicals.
  story_context: >-
    During one stormy night, astronomer Mara Venn returns to the abandoned
    coastal observatory where her estranged father Elias has secretly kept
    watch for a comet they first discovered together.
  continuity: >-
    Clothing, character age, props, weather, and lighting direction remain
    consistent throughout the film unless a clip explicitly overrides them.
  negative_prompt: >-
    subtitles, captions, title cards, watermark, distorted hands, duplicate
    people, inconsistent clothing, abrupt lighting changes, low quality

characters:
  mara:
    name: Mara Venn
    speaker_id: S1
    appearance: >-
      a 38-year-old woman with an angular face, olive skin, tired hazel eyes,
      and shoulder-length black hair containing one silver streak
    wardrobe: >-
      a dark navy wool coat over a burgundy turtleneck, with a worn brass
      observatory key hanging from a leather cord
    voice: >-
      a low, controlled English voice with a faint northern accent,
      deliberate pacing, and restrained emotion

  elias:
    name: Elias Venn
    speaker_id: S2
    appearance: >-
      a thin 68-year-old man with weathered pale skin, white hair, and round
      wire-frame glasses
    wardrobe: >-
      a brown tweed waistcoat, rolled white sleeves, and dark trousers
    voice: >-
      a soft, breathy English voice spoken slowly with occasional pauses

locations:
  observatory_exterior:
    description: >-
      An old stone observatory stands above a stormy sea at blue hour. Its
      open dome glows with warm tungsten light beneath fast-moving clouds.
    soundscape: >-
      Strong coastal wind, rough surf, and rain surround the observatory while
      distant thunder rolls across the sea.

  observatory_dome:
    description: >-
      Inside the old stone observatory are a large brass telescope, a rotating
      timber dome, scattered star charts, and warm tungsten desk lamps.
    soundscape: >-
      Wind presses against the dome, rain taps the glass, and old machinery
      creaks quietly above the distant sea.

  summer_field:
    description: >-
      A sunlit summer field of tall dry grass beneath a cloudless afternoon
      sky.
    soundscape: >-
      Warm wind moves through the grass with distant insects and birds.

audio:
  default_music: >-
    A restrained slow score of low cello and sparse piano notes, with no
    percussion and no dramatic swell.
  music:
    memory: >-
      A delicate solo piano phrase at a slow tempo with no other instruments.

defaults:
  duration_seconds: 8
  # Every clip after the first continues the previous clip unless overridden.
  context: previous
  window: 39
  mode: masked
  location: observatory_dome
  music: default

clips:
  - id: establishing
    context: none
    seed: 41001
    location: observatory_exterior
    cast: []
    summary: A storm gathers around the illuminated observatory.
    detailed_description: >-
      A wide establishing shot slowly pushes toward the open dome. Lightning
      softly illuminates the clouds behind the observatory as warm light spills
      through the windows and rain crosses the frame.

  - id: enter_dome
    cast: [mara]
    summary: Mara enters the dome and confronts the unchanged telescope.
    continuity:
      inherit_motion: true
      inherit_action: true
      notes: >-
        Preserve the direction of the storm light and the forward camera
        momentum from the exterior approach.
    detailed_description: >-
      A slowly tracking medium-wide view follows Mara into the dome as she
      crosses toward the telescope and closes her right hand around the brass
      focusing wheel. Without looking away from the telescope, she says
      quietly, <d>[English] You kept it pointed at the same star.</d>

  - id: elias_reply
    cast: [mara, elias]
    summary: Elias steps from the shadows and tells Mara he waited for her.
    detailed_description: >-
      A slow, small arc holds a medium two-shot as Elias emerges from the shadow
      beside the chart table. Mara remains beside the telescope and turns only
      her head toward him. With a tired half-smile, Elias says,
      <d>[English] I was waiting for you to come back.</d>

  - id: memory_insert
    # A fresh root makes a deliberate hard cut and shares no latent context.
    context: none
    seed: 92017
    location: summer_field
    cast: [mara]
    summary: A childhood memory shows young Mara playing with a telescope.
    character_overrides:
      mara:
        appearance: >-
          an eight-year-old girl with Mara's same hazel eyes and black hair
        wardrobe: a faded yellow summer dress
    music: memory
    detailed_description: >-
      In a gently handheld close-up, young Mara raises a handmade cardboard
      telescope and squints through it while tall grass moves around her.

  - id: return_to_dome
    # Branch from the earlier dome take rather than from the memory insert.
    context:
      from: elias_reply
      window: 39
      mode: masked
    location: observatory_dome
    cast: [mara, elias]
    summary: Mara sees the returning comet reflected in the open dome.
    continuity:
      inherit_motion: true
      inherit_action: true
    detailed_description: >-
      A close-up slowly pushes toward Mara beside the telescope. She looks up
      as a brilliant comet becomes visible through the open dome, reflected in
      her eyes, while Elias remains still in the background.
