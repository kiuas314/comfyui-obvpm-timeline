[project]
name = "comfyui-obvpm-timeline"
description = "A timeline for MiniMax H3 video: generate a clip, then extend it, prepend to it or bridge between clips seamlessly from their saved latents. The Timeline node is a mini video editor to arrange, cut and preview them, make seamless loops, and upscale the whole sequence in one pass. Companion to comfyui-obvpm."
version = "0.1.4"
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.9"

# Everything except YAML parsing is already in ComfyUI's requirements.
# PyYAML is small, pure infrastructure for the optional unattended batch
# manifest nodes; safe_load is used, never the object-constructing loader.
dependencies = ["PyYAML>=6.0"]

[project.urls]
Repository = "https://github.com/chanon/comfyui-obvpm-timeline"
#  Used by Comfy Registry https://comfyregistry.org

[tool.comfy]
PublisherId = "chanon"
DisplayName = "comfyui-obvpm-timeline"
Icon = ""
# the registry lists this as the supported ComfyUI version (core's Model
# Sparse Attention node, used by the workflow, arrived in 0.35.0)
requires-comfyui = ">=0.35.0"
